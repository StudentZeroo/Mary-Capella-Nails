<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Style to apply transition/glow effects if needed -->
  <style>
    .logo-stroke {
      fill: none;
      stroke: #D4AF37;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo-fill {
      fill: #D4AF37;
    }
  </style>
  
  <g transform="translate(10, 10)">
    <!-- Sun (Golden Circle Outline in the background) -->
    <circle cx="50" cy="45" r="22" class="logo-stroke" stroke-dasharray="1 3" />
    <circle cx="50" cy="45" r="18" class="logo-stroke" opacity="0.6" />
    
    <!-- Stylized Mountains (Hills in foreground) -->
    <!-- Left Hill -->
    <path d="M 15,80 C 30,65 45,65 55,75" class="logo-stroke" />
    <!-- Right Hill -->
    <path d="M 40,82 C 55,68 70,68 85,80" class="logo-stroke" />
    <!-- Center Hill Base -->
    <path d="M 10,80 L 90,80" class="logo-stroke" stroke-width="1" opacity="0.8" />
    
    <!-- Botanical Branch (Plant/Leaf extending from center-right upwards) -->
    <path d="M 50,78 Q 45,55 52,30" class="logo-stroke" stroke-width="1.8" />
    
    <!-- Leaves (Stylized shapes along the stem) -->
    <!-- Leaf 1 Left -->
    <path d="M 48,65 C 42,63 40,58 46,56 C 48,58 49,62 48,65 Z" class="logo-fill" opacity="0.9" />
    <!-- Leaf 1 Right -->
    <path d="M 49,60 C 55,58 57,53 51,51 C 49,53 49,57 49,60 Z" class="logo-fill" opacity="0.9" />
    <!-- Leaf 2 Left -->
    <path d="M 47,48 C 41,46 39,41 45,39 C 47,41 48,45 47,48 Z" class="logo-fill" opacity="0.9" />
    <!-- Leaf 2 Right -->
    <path d="M 49,43 C 55,41 57,36 51,34 C 49,36 49,40 49,43 Z" class="logo-fill" opacity="0.9" />
    <!-- Leaf Top -->
    <path d="M 52,30 C 51,24 49,22 53,20 C 55,22 54,26 52,30 Z" class="logo-fill" opacity="0.9" />

    <!-- Cocoa Pod Symbol (Minimalist, representing chocolate history) -->
    <!-- Positioned subtly at the bottom center -->
    <path d="M 45,80 C 47,83 53,83 55,80 C 57,78 55,75 50,75 C 45,75 43,78 45,80 Z" class="logo-stroke" stroke-width="1" />
  </g>
</svg>
